# Every push to master is released (AGENTS.md rule 5: no skip).
#
# 1. version: works out the next version with scripts/release_version.py. Each merge since
#    the latest v* tag gets its own bump (its PR's semver:* labels, else a new
#    docs/whats-new/features.json entry, else patch) and the biggest one wins, so merges that
#    queued up behind a running release are released together without losing a feature bump.
#    A deploy:manual label on any of those PRs makes the release a prerelease. Release notes
#    come from the docs/changelog entries added since the tag.
# 2. build: the shared apettey/eve-contracts build-windows-app.yml (version + release-tag +
#    prerelease) runs HangarScope.Tests, publishes win-x64, packs Velopack, and only after all
#    of that succeeds creates the vX.Y.Z tag on the built commit and publishes the GitHub
#    Release. Installed apps auto-update from it, except from a prerelease: they ignore it until
#    it is promoted with `gh release edit vX.Y.Z --prerelease=false`. If publishing fails before
#    a Release is out, the shared workflow deletes the tag it created, so the next run retries.
# 3. finalize: replaces the generated release notes with the ones from step 1.
#
# Re-running failed jobs is safe while no newer version has been released: the shared workflow
# reuses a tag already on this commit and doesn't upload Velopack packages again once the Release
# has them. finalize fails if the Release is still a draft or misses the zip or Velopack package.
# A run whose commit is already in a later release does nothing.
#
# A pushed v* tag (manual fallback: scripts/release.ps1) still builds and publishes that tag
# the old way; the master push that release.ps1 makes alongside it is skipped because its
# commit is already tagged. A tag left without a complete release (published, with the zip) is
# finished by running this workflow by hand (workflow_dispatch) on master; push runs never do
# that, so they can't race the tag build of a release.ps1 push. A tagged commit whose release is
# complete only gets its notes rewritten.
name: Release

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch: # master only: retry a failed release, finish a tag left without one, or rewrite its notes

# One master release at a time, never cancelled half-way. If several merges queue up, GitHub
# keeps only the newest pending run; it still covers the dropped ones because the bump and notes
# span every merge since the latest tag. Tag pushes (manual fallback) get their own group so a
# master push can't replace a queued tag build.
concurrency:
  group: ${{ github.ref_type == 'tag' && format('release-{0}', github.ref_name) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # A dispatch from another branch would tag and auto-update a commit that isn't on master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # PR labels decide the bump and deploy:manual; a failed lookup fails the run
    outputs:
      release: ${{ steps.bump.outputs.release }}
      finalize: ${{ steps.bump.outputs.finalize }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history since the latest tag

      - name: Release script tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Compute version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tags=$RUNNER_TEMP/tags.txt
          # Only tags in HEAD's history: a re-run of an older run must not version from a newer tag.
          git tag --merged HEAD --list 'v*' > "$tags"
          head_tag=$(git tag --points-at HEAD --list 'v*' | python3 scripts/release_version.py latest-tag)
          # HEAD already released in a later version (an old run re-run after newer merges shipped):
          # releasing it again would publish older code as the newest version.
          # grep exits 1 when it filters every tag out; any other failure fails the run.
          later=$(git tag --contains HEAD --list 'v*' \
            | { grep -vxF -f <(git tag --points-at HEAD --list 'v*') || [ $? -eq 1 ]; } \
            | python3 scripts/release_version.py latest-tag)
          if [ -z "$head_tag" ] && [ -n "$later" ]; then
            echo "::warning::$GITHUB_SHA is already released in $later; nothing to do."
            { echo "release=false"; echo "finalize=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release=true
          if [ -n "$head_tag" ]; then
            # Complete = published (not a draft) with the zip, which the shared workflow attaches last.
            # Drafts are only listed by the releases endpoint; a failed lookup fails the run.
            complete=$(HEAD_TAG="$head_tag" ZIP="HangarScope-${head_tag#v}-win-x64.zip" \
              gh api --paginate "repos/$REPO/releases" \
              --jq '.[] | select(.tag_name == env.HEAD_TAG and (.draft | not)) | select(any(.assets[]; .name == env.ZIP)) | .id')
            if [ -n "$complete" ]; then
              # Already released: only the notes are (re)written.
              echo "HEAD is already tagged $head_tag and released - rewriting its notes only."
              release=false
            elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              # On a push the tag's own run (release.ps1 fallback) or an earlier run owns it. "Re-run all
              # jobs" lands here too, and doesn't finish the release: only a manual run does.
              echo "::warning::$head_tag is tagged on this commit but its release isn't complete (published, with the zip). If no tag build is still running, finish it: Actions > Release > Run workflow on master."
              { echo "release=false"; echo "finalize=false"; } >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "Run by hand on $head_tag, tagged without a complete release: finishing it."
            fi
            # Notes and labels cover the merges up to this tag, so leave it out of the tag list.
            git tag --points-at HEAD --list 'v*' > "$RUNNER_TEMP/head-tags.txt"
            grep -vxF -f "$RUNNER_TEMP/head-tags.txt" "$tags" > "$tags.new" || true
            mv "$tags.new" "$tags"
          fi
          latest=$(python3 scripts/release_version.py latest-tag < "$tags")
          range=${latest:+$latest..}HEAD
          echo "LATEST=$latest" >> "$GITHUB_ENV"

          if [ -n "$latest" ]; then
            git diff --name-only --diff-filter=A "$latest" HEAD > "$RUNNER_TEMP/added.txt"
            git show "$latest:docs/whats-new/features.json" > "$RUNNER_TEMP/features-before.json" 2>/dev/null || true
          else
            git ls-files > "$RUNNER_TEMP/added.txt"
          fi
          git log --format=%s --no-merges "$range" > "$RUNNER_TEMP/commits.txt"

          # One decision per merge into master (first-parent commits): its own diff, features.json
          # before/after and PR labels. Direct pushes have no PR, so no labels.
          d=$RUNNER_TEMP/merge
          : > "$RUNNER_TEMP/decisions.txt"
          # Listed to a file first so a failing rev-list fails the run instead of looping zero times
          # (which would release unheld, without the merges' labels).
          git rev-list --first-parent "$range" > "$RUNNER_TEMP/shas.txt"
          while read -r sha; do
            : > "$d-before.json"; : > "$d-after.json"
            if parent=$(git rev-parse -q --verify "$sha^1"); then
              git diff --name-only "$parent" "$sha" > "$d-changed.txt"
              git show "$parent:docs/whats-new/features.json" > "$d-before.json" 2>/dev/null || true
            else
              git ls-tree -r --name-only "$sha" > "$d-changed.txt"
            fi
            git show "$sha:docs/whats-new/features.json" > "$d-after.json" 2>/dev/null || true
            # Never treat labels as absent because the lookup failed: that would drop a
            # deploy:manual hold or a semver:* label.
            if ! prs=$(gh api "repos/$REPO/commits/$sha/pulls"); then
              echo "::error::Could not look up the pull request for $sha (labels decide the version and deploy:manual)."
              exit 1
            fi
            labels=$(jq -c --arg sha "$sha" '[.[] | select(.merge_commit_sha == $sha) | .labels[].name]' <<< "$prs")
            python3 scripts/release_version.py bump \
              --changed-paths-file "$d-changed.txt" --labels "$labels" \
              --features-before "$d-before.json" --features-after "$d-after.json" > "$d-result.txt"
            bump=$(sed -n 's/^bump=//p' "$d-result.txt")
            reason=$(sed -n 's/^reason=//p' "$d-result.txt")
            pre=$(sed -n 's/^prerelease=//p' "$d-result.txt")
            echo "$(git log -1 --format='%h %s' "$sha"): $bump ($reason; prerelease: $pre; labels: $labels)"
            echo "$bump $pre $reason" >> "$RUNNER_TEMP/decisions.txt"
          done < "$RUNNER_TEMP/shas.txt"

          python3 scripts/release_version.py combine \
            --latest-tag "$latest" --decisions-file "$RUNNER_TEMP/decisions.txt" > "$RUNNER_TEMP/combined.txt"
          if [ -n "$head_tag" ]; then
            # Finishing (or re-noting) an existing tag: its version stands, the labels still decide prerelease.
            prerelease=$(sed -n 's/^prerelease=//p' "$RUNNER_TEMP/combined.txt")
            { echo "bump=existing"; echo "version=${head_tag#v}"; echo "reason=$head_tag is already tagged on this commit"
              echo "prerelease=$prerelease"; } > "$RUNNER_TEMP/combined.txt"
          fi
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/combined.txt")
          { cat "$RUNNER_TEMP/combined.txt"; echo "tag=v$version"; echo "release=$release"; echo "finalize=true"; } \
            | tee -a "$GITHUB_OUTPUT"

      - name: Release notes
        id: notes
        if: steps.bump.outputs.finalize == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BUMP: ${{ steps.bump.outputs.bump }}
          REASON: ${{ steps.bump.outputs.reason }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py notes \
            --version "$VERSION" \
            --added-paths-file "$RUNNER_TEMP/added.txt" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --features-before "$RUNNER_TEMP/features-before.json" \
            --features-after docs/whats-new/features.json \
            --commits-file "$RUNNER_TEMP/commits.txt" > "$RUNNER_TEMP/notes.md"
          delim="NOTES_$(openssl rand -hex 12)" # random, so no line of the notes can end the value
          {
            echo "notes<<$delim"
            cat "$RUNNER_TEMP/notes.md"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Releasing v$VERSION"
            echo
            echo "**$BUMP** ($REASON), changes since ${LATEST:-the first commit}."
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "**Prerelease** (deploy:manual): installed copies ignore it until it is promoted."
              echo
            fi
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # Master pushes: test, build and pack, then tag and release the computed version.
  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
    permissions:
      contents: write
    with:
      project: HangarScope/HangarScope.csproj
      app-name: HangarScope
      main-exe: HangarScope.exe
      test-project: HangarScope.Tests/HangarScope.Tests.csproj
      version: ${{ needs.version.outputs.version }}
      release-tag: ${{ needs.version.outputs.tag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  # Release notes from release_version.py replace the generated ones. Also runs when the build was
  # skipped because the release is already complete (a dispatch or re-run after this job failed),
  # so notes are never silently left out.
  finalize:
    needs: [version, build]
    if: >-
      always() && needs.version.outputs.finalize == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release edit
    steps:
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          NOTES: ${{ needs.version.outputs.notes }}
          ZIP: HangarScope-${{ needs.version.outputs.version }}-win-x64.zip
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

          # Report what the Release really is: an existing Release keeps the draft/prerelease state it
          # had, whatever the labels say now.
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '[.isDraft, .isPrerelease, any(.assets[]; .name == env.ZIP), any(.assets[]; .name | endswith("-full.nupkg"))] | map(tostring) | join(" ")')
          read -r draft pre zip nupkg <<< "$state"
          {
            echo "## $TAG"
            echo
            if [ "$pre" = "true" ]; then
              echo "Published as a **prerelease**: installed copies don't update to it."
              echo "Once the outside work is done, promote it: \`gh release edit $TAG --prerelease=false\`"
            else
              echo "Published as a normal release. Installed copies auto-update to it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A promoted deploy:manual release (labels hold, Release stable) is the normal end state, so a
          # notes-only run says nothing about it. Never suggest re-holding: installed copies may run it.
          if [ "$pre" = "true" ] && [ "$PRERELEASE" = "false" ]; then
            echo "::warning::$TAG is a prerelease although no PR in it has deploy:manual (the Release existed before this run). If nothing is waiting, promote it: gh release edit $TAG --prerelease=false"
          elif [ "$pre" = "false" ] && [ "$PRERELEASE" = "true" ] && [ "$BUILD_RESULT" = "success" ]; then
            echo "::warning::$TAG has deploy:manual but was already published as a normal release before this run, so installed copies may already update to it. Check the outside work is done."
          fi
          if [ "$draft" != "false" ] || [ "$zip" != "true" ] || [ "$nupkg" != "true" ]; then
            echo "::error::$TAG is incomplete (draft: $draft, zip: $zip, Velopack package: $nupkg). Publish the draft with 'gh release edit $TAG --draft=false' if it has every file, or delete the draft and run this workflow by hand on master."
            exit 1
          fi

  # v* tag pushes (manual fallback): the shared workflow takes the version from the tag.
  # Push only: a workflow_dispatch on a tag ref must not publish anything.
  build-tag:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
    permissions:
      contents: write
    with:
      project: HangarScope/HangarScope.csproj
      app-name: HangarScope
      main-exe: HangarScope.exe
      test-project: HangarScope.Tests/HangarScope.Tests.csproj
