# Every push to master is released (AGENTS.md rule 5: no skip).
#
# 1. version: the shared next-version action from apettey/eve-contracts (the same code eve-contracts
#    and multi-box use) works out the next version. Each merge since the newest published v* tag in
#    master's history gets its own bump (its PR's semver:* labels, else a new
#    docs/whats-new/features.json entry, else patch) and the biggest one wins, so merges that queued
#    up behind a running release are released together without losing a feature bump. A
#    deploy:manual label on any of those PRs makes the release a prerelease. A failed PR lookup
#    fails the run. The notes come from the docs/changelog entries added since that tag (full
#    text), with the new what's-new entries on top and every PR below.
# 2. build: the shared apettey/eve-contracts build-windows-app.yml (version + release-tag +
#    prerelease) runs HangarScope.Tests, publishes win-x64, packs Velopack, and only after all
#    of that succeeds creates the vX.Y.Z tag on the built commit and publishes the GitHub
#    Release. Installed apps auto-update from it, except from a prerelease: they ignore it until
#    it is promoted with `gh release edit vX.Y.Z --prerelease=false`. If publishing fails before
#    a Release is out, the shared workflow deletes the tag it created, so the next run retries.
#    It refuses to publish a version below an already released one.
# 3. finalize: the shared finalize-release action replaces the generated notes with the ones from
#    step 1, and fails if the Release is a draft or misses the zip or the Velopack packages.
#
# A commit that is already tagged reuses its tag: built if its Release isn't published yet, notes
# only if it is. A run on a commit that is already in a later release does nothing.
name: Release

on:
  push:
    branches: ["master"]
  workflow_dispatch: # master only: retry a failed release or rewrite a release's notes

# One release at a time, never cancelled half-way. If several merges queue up, GitHub keeps only
# the newest pending run; it still covers the dropped ones because the bump and notes span every
# merge since the newest published tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # A dispatch from another branch would tag and auto-update a commit that isn't on master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # PR labels decide the bump and deploy:manual; a failed lookup fails the run
    outputs:
      release: ${{ steps.next.outputs.release }}
      finalize: ${{ steps.next.outputs.finalize }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      prerelease: ${{ steps.next.outputs.prerelease }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history since the newest published tag

      - name: Compute version
        id: next
        uses: apettey/eve-contracts/.github/actions/next-version@main
        with:
          features-path: docs/whats-new/features.json
          changelog-dir: docs/changelog
          app-name: HangarScope
          notes-title: "{app} {tag}"
          release-log-notes: full

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
    permissions:
      contents: write
    with:
      project: HangarScope/HangarScope.csproj
      app-name: HangarScope
      main-exe: HangarScope.exe
      test-project: HangarScope.Tests/HangarScope.Tests.csproj
      version: ${{ needs.version.outputs.version }}
      release-tag: ${{ needs.version.outputs.tag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  # Also runs when the build was skipped because the Release is already published (a re-run or a
  # dispatch after this job failed), so notes are never silently left out.
  finalize:
    needs: [version, build]
    if: >-
      always() && needs.version.outputs.finalize == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release edit
    steps:
      - name: Release notes and state
        uses: apettey/eve-contracts/.github/actions/finalize-release@main
        with:
          tag: ${{ needs.version.outputs.tag }}
          notes: ${{ needs.version.outputs.notes }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          build-result: ${{ needs.build.result }}
          app-name: HangarScope
