# Every push to master is released (AGENTS.md rule 5: no skip).
#
# 1. version: works out the next version with scripts/release_version.py. Each merge since
#    the latest v* tag gets its own bump (its PR's semver:* labels, else a new
#    docs/whats-new/features.json entry, else patch) and the biggest one wins, so merges that
#    queued up behind a running release are released together without losing a feature bump.
#    Release notes come from the docs/changelog entries added since the tag.
# 2. build: the shared apettey/eve-contracts build-windows-app.yml runs HangarScope.Tests,
#    publishes win-x64, packs Velopack, and only after all of that succeeds creates the
#    vX.Y.Z tag on the built commit and publishes the GitHub Release. Installed apps
#    auto-update from it.
#
# A pushed v* tag (manual fallback: scripts/release.ps1) still builds and publishes that tag
# the old way; the master push that release.ps1 makes alongside it is skipped because its
# commit is already tagged. A tag left without a complete release (publishing failed after the
# tag was pushed) is finished by running this workflow by hand (workflow_dispatch) on master;
# push runs never do that, so they can't race the tag build of a release.ps1 push.
name: Release

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch: # on master: retry a failed release, or finish a tag left without one

# One master release at a time, never cancelled half-way. If several merges queue up, GitHub
# keeps only the newest pending run; it still covers the dropped ones because the bump and notes
# span every merge since the latest tag. Tag pushes (manual fallback) get their own group so a
# master push can't replace a queued tag build.
concurrency:
  group: ${{ github.ref_type == 'tag' && format('release-{0}', github.ref_name) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.bump.outputs.skip }}
      version: ${{ steps.bump.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history since the latest tag

      - name: Release script tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Compute version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tags=$RUNNER_TEMP/tags.txt
          git tag --list 'v*' > "$tags"
          head_tag=$(git tag --points-at HEAD --list 'v*' | python3 scripts/release_version.py latest-tag)
          resume=""
          if [ -n "$head_tag" ]; then
            # Complete = published (not a draft) with the zip, which the shared workflow attaches last.
            zip="HangarScope-${head_tag#v}-win-x64.zip"
            complete=$(gh release view "$head_tag" --repo "$REPO" --json isDraft,assets \
              --jq "(.isDraft | not) and any(.assets[]; .name == \"$zip\")" 2>/dev/null || echo false)
            if [ "$complete" = "true" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              # On a push the tag's own run (release.ps1 fallback) or an earlier run owns it.
              echo "HEAD is already tagged $head_tag (release complete: $complete) - nothing to do here."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Run by hand on a tag left without a complete release: finish that release.
            resume=$head_tag
            git tag --points-at HEAD --list 'v*' > "$RUNNER_TEMP/head-tags.txt"
            grep -vxF -f "$RUNNER_TEMP/head-tags.txt" "$tags" > "$tags.new" || true
            mv "$tags.new" "$tags"
          fi
          latest=$(python3 scripts/release_version.py latest-tag < "$tags")
          range=${latest:+$latest..}HEAD
          echo "LATEST=$latest" >> "$GITHUB_ENV"

          if [ -n "$latest" ]; then
            git diff --name-only --diff-filter=A "$latest" HEAD > "$RUNNER_TEMP/added.txt"
            git show "$latest:docs/whats-new/features.json" > "$RUNNER_TEMP/features-before.json" 2>/dev/null || true
          else
            git ls-files > "$RUNNER_TEMP/added.txt"
          fi
          git log --format=%s --no-merges "$range" > "$RUNNER_TEMP/commits.txt"

          if [ -n "$resume" ]; then
            { echo "bump=resume"; echo "version=${resume#v}"; echo "reason=finishing $resume, tagged but not released"; } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          # One decision per merge into master (first-parent commits): its own diff, features.json
          # before/after and PR labels. Direct pushes have no PR, so no labels.
          d=$RUNNER_TEMP/merge
          : > "$RUNNER_TEMP/decisions.txt"
          for sha in $(git rev-list --first-parent "$range"); do
            : > "$d-before.json"; : > "$d-after.json"
            if parent=$(git rev-parse -q --verify "$sha^1"); then
              git diff --name-only "$parent" "$sha" > "$d-changed.txt"
              git show "$parent:docs/whats-new/features.json" > "$d-before.json" 2>/dev/null || true
            else
              git ls-tree -r --name-only "$sha" > "$d-changed.txt"
            fi
            git show "$sha:docs/whats-new/features.json" > "$d-after.json" 2>/dev/null || true
            labels=$(gh api "repos/$REPO/commits/$sha/pulls" \
              --jq ".[] | select(.merge_commit_sha == \"$sha\") | .labels[].name" | paste -sd, -)
            python3 scripts/release_version.py bump \
              --changed-paths-file "$d-changed.txt" --labels "$labels" \
              --features-before "$d-before.json" --features-after "$d-after.json" > "$d-result.txt"
            bump=$(sed -n 's/^bump=//p' "$d-result.txt")
            reason=$(sed -n 's/^reason=//p' "$d-result.txt")
            echo "$(git log -1 --format='%h %s' "$sha"): $bump ($reason; labels: ${labels:-none})"
            echo "$bump $reason" >> "$RUNNER_TEMP/decisions.txt"
          done

          python3 scripts/release_version.py combine \
            --latest-tag "$latest" --decisions-file "$RUNNER_TEMP/decisions.txt" | tee -a "$GITHUB_OUTPUT"

      - name: Release notes
        id: notes
        if: steps.bump.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BUMP: ${{ steps.bump.outputs.bump }}
          REASON: ${{ steps.bump.outputs.reason }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py notes \
            --version "$VERSION" \
            --added-paths-file "$RUNNER_TEMP/added.txt" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --features-before "$RUNNER_TEMP/features-before.json" \
            --features-after docs/whats-new/features.json \
            --commits-file "$RUNNER_TEMP/commits.txt" > "$RUNNER_TEMP/notes.md"
          delim="NOTES_$(openssl rand -hex 12)" # random, so no line of the notes can end the value
          {
            echo "notes<<$delim"
            cat "$RUNNER_TEMP/notes.md"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Releasing v$VERSION"
            echo
            echo "**$BUMP** ($REASON), changes since ${LATEST:-the first commit}."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # Master pushes: test, build and pack, then tag and release the computed version.
  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
    permissions:
      contents: write
    with:
      project: HangarScope/HangarScope.csproj
      app-name: HangarScope
      main-exe: HangarScope.exe
      test-project: HangarScope.Tests/HangarScope.Tests.csproj
      version: ${{ needs.version.outputs.version }}
      release-notes: ${{ needs.version.outputs.notes }}

  # v* tag pushes (manual fallback): the shared workflow takes the version from the tag.
  build-tag:
    if: github.ref_type == 'tag'
    uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
    permissions:
      contents: write
    with:
      project: HangarScope/HangarScope.csproj
      app-name: HangarScope
      main-exe: HangarScope.exe
      test-project: HangarScope.Tests/HangarScope.Tests.csproj
