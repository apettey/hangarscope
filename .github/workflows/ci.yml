# Pull request gate (Dependabot's included). Merging to master releases straight away
# (release.yml), so this proves the PR is releasable:
# - release: docs/whats-new/features.json validation and the version this PR would release (job
#   summary), both with the shared actions from apettey/eve-contracts
# - build: build, HangarScope.Tests and the win-x64 release publish
name: CI

on:
  pull_request:
    # labeled/unlabeled: a semver:* label changes the predicted version, deploy:manual makes it a prerelease.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A newer push or label change on the same PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the preview looks up unreleased merges' labels; a failed lookup fails it
    outputs:
      version: ${{ steps.preview.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and the merge base

      # The shared validator from apettey/eve-contracts. Image paths are relative to docs/whats-new.
      - name: Validate features.json
        uses: apettey/eve-contracts/.github/actions/validate-features@main
        with:
          path: docs/whats-new/features.json
          images-root: docs/whats-new
          image-prefix: img/
          base: ${{ github.event.pull_request.base.sha }}
          pr: ${{ github.event.pull_request.number }}

      # The shared next-version action in PR mode: the same code as the release run, so the
      # prediction matches what merging releases (job summary: "Merging this PR would release vX.Y.Z").
      - name: Predict version
        id: preview
        uses: apettey/eve-contracts/.github/actions/next-version@main
        with:
          mode: pr
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          features-path: docs/whats-new/features.json
          changelog-dir: docs/changelog
          app-name: HangarScope

  build:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build HangarScope/HangarScope.csproj -c Release --nologo

      - name: Test
        run: dotnet test HangarScope.slnx -c Release --nologo

      # The same publish the release build runs (shared build-windows-app.yml), with the
      # version this PR would release.
      - name: Publish win-x64
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: dotnet publish HangarScope/HangarScope.csproj -c Release -r win-x64 --self-contained true "-p:Version=$env:VERSION" -o publish --nologo
